<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Потребности в кадрах 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column wizard, 680px measure; one question per block, long lists collapse into selects */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F1F3F5;
  --ink:#212529; --muted:#666D75; --faint:#99A0A8;
  --line:#E4E7EB; --line-strong:#CDD3DA;
  --accent:#7BC24D; --accent-ink:#4E8A29; --accent-soft:#EDF6E3;
  --warn:#8C5806; --warn-soft:#FBF1E0;
  --danger:#C0392B;
  --font-ui:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-display:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --chev:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%23666D75' stroke-width='1.8' stroke-linecap='round'/></svg>");
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:680px;margin:0 auto;padding:12px 16px 10px;display:flex;flex-direction:column;gap:9px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.logo-cluster{display:flex;align-items:center;gap:14px}
.logo-div{width:1px;height:26px;background:var(--line);flex:none}
.steprow{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:260px}
.psteps{display:flex;align-items:center}
.psteps{display:flex;align-items:center}
.pdot{width:25px;height:25px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:inherit;border:2px solid var(--line-strong);color:var(--muted);background:var(--surface);flex:none;cursor:pointer;transition:transform .1s}
.pdot:hover:not(:disabled){transform:scale(1.12)}
.pdot:disabled{cursor:default}
.pdot.done{background:var(--accent);border-color:var(--accent);color:#fff}
.pdot.now{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pbar{width:30px;height:2px;background:var(--line-strong);flex:none}
.pbar.done{background:var(--accent)}
.langbar{max-width:680px;margin:0 auto;padding:9px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
@media(max-width:480px){.pbar{width:18px}.pdot{width:23px;height:23px}}
.brand-logo{display:inline-flex;align-items:center}
.brand-logo img{display:block;height:26px;width:auto}
#minLogo{height:30px}
.stepmeta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{display:flex;gap:4px}
.track span{height:4px;flex:1;border-radius:2px;background:var(--line)}
.track span.done{background:var(--accent)}
.track span.now{background:var(--accent);opacity:.5}

main{max-width:680px;margin:0 auto;padding-block:24px 8px;padding-inline:16px}
main.wide{max-width:1040px}
.step{display:flex;flex-direction:column;gap:26px}
.steptitle{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1.2}
.steplead{margin:7px 0 0;color:var(--muted);font-size:15px;max-width:58ch}

.actions{position:sticky;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);margin-top:26px}
.actions-in{max-width:680px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:11px 20px;border-radius:9px;font-weight:600;font-size:15px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px}
.btn-quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn-sm{padding:8px 14px;font-size:14px;border-radius:8px}
.savenote{font-size:12.5px;color:var(--faint)}

/* question block */
.q{display:flex;flex-direction:column;gap:10px}
.qlabel{font-size:17px;font-weight:600;line-height:1.35}
.qhint{font-size:13.5px;color:var(--muted);line-height:1.45;margin:-4px 0 0}
.err{font-size:13.5px;color:var(--danger);font-weight:500}
.req{color:var(--danger);font-weight:700;margin-left:3px}
.legend{font-size:13px;color:var(--muted)}
.legend b{color:var(--danger)}
.lsw{display:flex;gap:3px;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface-2)}
.lsw button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.04em;padding:4px 10px;border-radius:999px;cursor:pointer}
.lsw button:hover{color:var(--ink)}
.lsw button[aria-pressed="true"]{background:var(--accent);color:#fff}
input.bad,textarea.bad,.sel.bad{border-color:var(--danger)}

/* controls */
.sel,input[type=text],input[type=number],textarea{
  width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:9px;padding:11px 13px}
.sel{appearance:none;-webkit-appearance:none;background-image:var(--chev);background-repeat:no-repeat;background-position:right 13px center;padding-right:36px;cursor:pointer}
.sel.placeholder{color:var(--muted)}
.sel.add{background-color:var(--surface-2);font-weight:500;color:var(--accent-ink);border-style:dashed}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{resize:vertical;min-height:88px}
.sel-sm{width:auto;min-width:92px;padding:7px 30px 7px 11px;font-size:14px;background-position:right 10px center;border-radius:8px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--line-strong)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt span{font-size:15px;line-height:1.4}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.opt.on small{color:var(--accent-ink);opacity:.85}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opts.row .opt{flex:1;min-width:140px}
.opt:has(input[data-act="hiring"]),
.opt:has(input[data-act="hiring"]):hover,
.opt.on:has(input[data-act="hiring"]),
.opt:has(input[data-act="creq"]),
.opt:has(input[data-act="creq"]):hover,
.opt.on:has(input[data-act="creq"]){border-color:transparent;background:transparent;padding-left:0;padding-right:0}

.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{display:inline-flex;align-items:center;gap:9px;background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:5px 7px 5px 14px;font-size:14px;font-weight:500}
.tag button{border:0;background:transparent;color:var(--accent-ink);cursor:pointer;font-size:16px;line-height:1;width:22px;height:22px;border-radius:50%;opacity:.6}
.tag button:hover{opacity:1;background:rgba(0,0,0,.08)}
.langline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:7px 8px 7px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.langline b{font-weight:600;font-size:14.5px;flex:1;min-width:88px}
.xbtn{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:17px;line-height:1;width:28px;height:28px;border-radius:7px}
.xbtn:hover{color:var(--danger);background:var(--surface)}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
.stepper button{width:42px;height:42px;border:0;background:transparent;font-size:20px;font-weight:600;color:var(--accent);cursor:pointer;line-height:1}
.stepper button:hover{background:var(--accent-soft)}
.stepper input{width:72px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;padding:11px 4px}

.note{border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);padding:12px 15px;border-radius:0 9px 9px 0;font-size:14px;line-height:1.5}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.hintbox{border:1px dashed var(--line-strong);background:var(--surface-2);color:var(--muted);padding:11px 14px;border-radius:9px;font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row dt{padding:11px 15px;font-size:13.5px;color:var(--muted);background:var(--surface-2);margin:0}
.row dd{padding:11px 15px;margin:0;font-size:15px;min-width:0;overflow-wrap:anywhere}
@media(max-width:520px){.row{grid-template-columns:1fr}.row dd{padding-top:0}}

/* need cards */
.needs{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.card.open{border-color:var(--accent)}
.card.invalid{border-color:var(--danger)}
.folded{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.folded:hover{background:var(--surface-2);border-radius:12px}
.card-n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.folded-txt{flex:1;min-width:0}
.folded-txt b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folded-txt span{display:block;font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-body{padding:4px 15px 16px;display:flex;flex-direction:column;gap:18px;border-top:1px solid var(--line)}
.card-body>.q:first-child{margin-top:14px}
.f{display:flex;flex-direction:column;gap:7px}
.flab{font-size:13px;font-weight:600;color:var(--muted)}

.combo{position:relative}
.combo-list{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:252px;overflow-y:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 12px 28px rgba(8,28,24,.16);padding:5px}
.combo-g{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);padding:9px 10px 5px}
.combo-o{padding:9px 10px;border-radius:7px;cursor:pointer;font-size:15px}
.combo-o:hover{background:var(--accent-soft);color:var(--accent-ink)}
.combo-empty{padding:11px 10px;color:var(--muted);font-size:14px}
.combo-add{color:var(--accent-ink);font-weight:600}
.combo-hint{padding:9px 10px;color:var(--muted);font-size:13px;line-height:1.4}
.combo-custom{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft)}
.dblock{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:14px}
.dblock.invalid{border-color:var(--danger)}
.dblock-head{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line-strong);border-radius:12px 12px 0 0}
.dblock-head .rn{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;margin-top:22px}
.dblock-dir{flex:1;min-width:0}
.dblock-dlabel{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.dblock-head .xbtn{flex:none;margin-top:22px}
.dtbl{width:100%;border-collapse:collapse}
.dtbl th,.dtbl td{border:1px solid var(--line);vertical-align:middle}
.dtbl th{text-align:left;font-size:13.5px;font-weight:500;color:var(--ink);padding:12px 14px;width:42%;max-width:230px;background:var(--surface-2)}
.dtbl td{padding:8px 12px}
.dtbl .sel,.dtbl input[type=number]{max-width:280px}
.dtbl .sel.add{max-width:180px;padding-top:9px;padding-bottom:9px;margin-top:6px}
.dtbl .langline{padding:5px 8px 5px 12px}
.dtbl .langline b{font-size:14px}
.dtbl td>div[style*="flex-direction:column"]{gap:6px!important}
.rate-cell{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rate-cell input[type=number]{max-width:130px}
.rate-cell .sel{max-width:170px}
.dblock-err{padding:9px 14px;color:var(--danger);font-size:12.5px;background:rgba(192,57,43,.05);border-radius:0 0 12px 12px}
@media(max-width:560px){
  .dtbl,.dtbl tbody,.dtbl tr,.dtbl th,.dtbl td{display:block;width:auto;max-width:none}
  .dtbl tr{border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
  .dtbl tr:last-child{margin-bottom:0}
  .dtbl th{width:auto;max-width:none;border:0;border-bottom:1px solid var(--line);background:var(--surface-2);padding:9px 12px;font-size:12px;font-weight:600;color:var(--muted);border-radius:10px 10px 0 0}
  .dtbl td{border:0;padding:11px 12px}
  .dtbl .sel,.dtbl .sel.add{width:100%;max-width:none}
  .rate-cell{flex-direction:column;align-items:stretch;gap:8px}
  .rate-cell input[type=number],.rate-cell .sel{max-width:none;width:100%}
  .dblock-head{padding:11px 12px}
  .dblock-head .rn{margin-top:20px}
  .dblock-head .xbtn{margin-top:20px}
}
.btn-add{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent-ink);padding:10px 18px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
.btn-add:hover{filter:brightness(.97)}
.miniflab{font-size:13px;color:var(--muted)}
.tp-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface-2)}
.tp-logo{background:#fff;border-radius:10px;padding:14px 16px;display:inline-flex;margin-bottom:12px}
.tp-logo img{display:block;height:46px;width:auto}
.tp-about{margin:0 0 14px;font-size:14.5px;line-height:1.5;color:var(--text)}

.sum{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.sum-h{padding:11px 15px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--muted)}
.sum-i{padding:13px 15px;border-top:1px solid var(--line);font-size:15px}
.sum-i:first-of-type{border-top:0}
.sum-i em{font-style:normal;color:var(--muted);font-size:13.5px;display:block;margin-top:3px}

.done-wrap{text-align:center;display:flex;flex-direction:column;gap:15px;align-items:center;padding-block:18px}
.done-mark{width:54px;height:54px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:27px}
.json{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;white-space:pre;overflow-x:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:13px;max-height:260px;overflow-y:auto;text-align:left}
.report-wrap{width:100%}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;color:var(--ink);font-size:13px;line-height:1.45;text-align:left;box-shadow:0 2px 14px rgba(0,0,0,.05);overflow-x:auto}
.paper .rhead{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:2px solid var(--accent);padding-bottom:12px;margin-bottom:14px}
.paper .rlogos{display:flex;gap:12px;align-items:center}
.paper .rhead img{height:28px;width:auto}
.paper h1{font-size:18px;margin:0 0 2px}
.paper .rdate{color:var(--muted);font-size:12px}
.paper h2{font-size:14px;margin:16px 0 7px;color:var(--accent-ink)}
.paper h3.rd{font-size:13px;font-weight:600;margin:14px 0 5px;color:var(--ink)}
.paper table.rt{width:100%;border-collapse:collapse}
.paper table.rt td,.paper table.rt th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.paper td.rl{width:34%;background:var(--surface-2);color:var(--muted);font-weight:500}
.paper table.grid th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
.paper .rc{margin-top:14px;font-size:12.5px}
footer{max-width:680px;margin:0 auto;padding:18px 16px 30px;color:var(--faint);font-size:12.5px;line-height:1.55}
.guide{border:1px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:16px 18px;margin:0 0 20px}
.guide-h{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.guide-h .gi{width:30px;height:30px;border-radius:9px;background:#fff;border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.guide-h h3{margin:0;font-size:15px;font-weight:700;color:var(--ink);flex:1}
.guide-h .gchev{color:var(--accent-ink);font-size:13px;transition:transform .15s}
.guide.closed .gchev{transform:rotate(-90deg)}
.guide.closed .guide-body{display:none}
.guide-body{margin-top:14px}
.guide-list{display:flex;flex-direction:column;gap:12px}
.guide-item{display:flex;gap:12px;align-items:flex-start}
.gnum{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.guide-item div{font-size:13.5px;line-height:1.45;color:var(--muted)}
.guide-item b{color:var(--ink);font-weight:600}
.guide-rule{display:flex;gap:11px;margin-top:15px;padding:13px 14px;background:#fff;border:1px solid var(--accent);border-radius:11px}
.guide-rule .gr-i{flex:none;font-size:17px;line-height:1.2}
.guide-rule b{display:block;color:var(--accent-ink);font-size:13.5px;margin-bottom:3px}
.guide-rule p{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.guide-foot{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.guide-foot .gf-i{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.needs-layout{display:flex;gap:24px;align-items:flex-start}
.needs-main{flex:1;min-width:0}
.needs-aside{width:330px;flex:none;position:sticky;top:16px}
.needs-aside .guide{margin:0}
@media(max-width:899px){
  main.wide{max-width:680px}
  .needs-layout{flex-direction:column;gap:0}
  .needs-aside{width:auto;position:static;order:-1;margin-bottom:20px}
}
@media(min-width:900px){
  .needs-aside .guide-body{display:block!important}
  .needs-aside .gchev{display:none}
  .needs-aside .guide-h{cursor:default}
}
</style>

<div class="topbar">
  <div class="topbar-in">
    <div class="brandrow">
      <span class="logo-cluster">
        <span class="brand-logo"><img id="minLogo" alt="Digital.uz — Raqamli texnologiyalar vazirligi"></span>
        <span class="logo-div"></span>
        <span class="brand-logo"><img id="itLogo" alt="IT Park Uzbekistan"></span>
        <span class="logo-div"></span>
        <span class="brand-logo"><img id="decLogoL" alt="Raqamli talim"></span>
      </span>
      <div class="steprow">
        <div class="psteps" id="psteps" aria-hidden="true"></div>
        <span class="stepmeta" id="stepmeta"></span>

const lab=a=>a[LI];
const dirLabel=d=>{ if(!d) return ''; if(d.other!==undefined) return d.other; const g=DIRS[d.g]; return g?lab(g[1][d.i]):''; };
const dirRu=d=>{ if(!d) return ''; if(d.other!==undefined) return d.other; const g=DIRS[d.g]; return g?g[1][d.i][0]:''; };
const langLabel=(i,scope)=>{ if(+i===OTHER_LANG){const o=otherName(scope);return o||t('otherlang')} return lab(LANGLIST[+i]); };
const curSign=()=>{const c=CURRENCIES.find(x=>x[0]===S.currency);return Array.isArray(c[2])?c[2][LI]:c[2]};

/* ---- склонения ---- */
function nPeople(n){
  if(LI===0){const m=n%100,k=n%10;return n+' '+(m>10&&m<20?'человек':k===1?'человек':k>1&&k<5?'человека':'человек')}
  if(LI===1) return n+' kishi';
  return n+(n===1?' person':' people');
}
function nRoles(n){
  if(LI===0){const m=n%100,k=n%10;return n+' '+(m>10&&m<20?'направлениям':k===1?'направлению':'направлениям')}
  if(LI===1) return n+' yoʻnalish';
  return n+(n===1?' role':' roles');
}

<script>
/* ============ состояние ============ */
const KEY='itpark-demand-2027-v3';
const blankNeed=()=>({dir:null,count:5,grade:null,rate:'',langs:{},langOther:'',regions:[],quarter:null});
const fresh=()=>({
  lang:'ru',step:0,sent:false,open:-1,guideOpen:true,
  company:'',person:'',role:'',inn:'',phone:'',hiring:null,
  currency:'USD',common:false,commonLangs:{},commonLangOther:'',commonRegions:[],
  needs:[blankNeed()],
  exp:null,trainMonths:null,expYears:null,
  certs:{req:null,list:[],others:[]},
  edu:{past:null,orgs:[],forms:[],places:5,critical:''},
  consent:{truth:false,share:null,talent:false},
  errors:{}
});
let S=fresh(),restored=false;
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&typeof p==='object'){S=Object.assign(fresh(),p);S.errors={};restored=true}}}catch(e){}
LI=Math.max(0,UILANGS.findIndex(x=>x[0]===S.lang));
let saveTimer=null,flashTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));flash(t('saved'))}catch(e){}},400)}
function flash(x){const n=document.getElementById('savenote');if(!n)return;n.textContent=x;clearTimeout(flashTimer);flashTimer=setTimeout(()=>{n.textContent=''},2000)}

/* ============ разметка ============ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const errOf=k=>S.errors[k]?`<div class="err">${esc(S.errors[k])}</div>`:'';
const rq='<span class="req" title="*">*</span>';
const bad=k=>S.errors[k]?' bad':'';
const otherName=scope=>((scope==='c'?S.commonLangOther:(S.needs[+scope]||{}).langOther)||'').trim();
const totalPeople=()=>S.needs.filter(n=>n.dir).reduce((a,n)=>a+(Number(n.count)||0),0);
const dirCount=()=>S.needs.filter(n=>n.dir).length;
const money=v=>{const n=Number(v);if(!v||!isFinite(n)||n<=0)return '';
  return S.currency==='USD'?('$'+n.toLocaleString('en-US')):(n.toLocaleString('ru-RU').replace(/ /g,' ')+' '+curSign())};
const langPairs=scope=>{const m=scope==='c'?S.commonLangs:S.needs[+scope].langs;
  return Object.keys(m).map(k=>langLabel(k,scope)+' '+LEVELS[m[k]])};

function sel(act,items,idx,ph,cls){
  const o=[`<option value="" ${idx===null||idx===undefined?'selected':''}>${esc(ph)}</option>`]
    .concat(items.map((x,i)=>`<option value="${i}" ${idx===i?'selected':''}>${esc(lab(x))}</option>`));
  return `<select class="sel ${cls||''} ${idx===null||idx===undefined?'placeholder':''}" data-sel="${act}">${o.join('')}</select>`;
}
function addSel(act,items,used,ph){
  const left=items.map((x,i)=>[i,lab(x)]).filter(([i])=>used.indexOf(i)<0);
  if(!left.length) return '';
  return `<select class="sel add" data-sel="${act}"><option value="" selected>${esc(ph)}</option>`
    + left.map(([i,txt])=>`<option value="${i}">${esc(txt)}</option>`).join('') + `</select>`;
}
function radios(name,act,items,cur,row){
  return `<div class="opts ${row?'row':''}">`+items.map(([k,tx,sb])=>`
    <label class="opt ${cur===k?'on':''}">
      <input type="radio" name="${name}" data-act="${act}" data-v="${esc(k)}" ${cur===k?'checked':''}>
      <span>${esc(tx)}${sb?`<small>${esc(sb)}</small>`:''}</span>
    </label>`).join('')+`</div>`;
}
function langBlock(scope,map){
  const keys=Object.keys(map);
  return `<div class="f">
    <span class="flab">${esc(t('langs'))}</span>
    ${keys.length?`<div style="display:flex;flex-direction:column;gap:7px">`+keys.map(k=>`
      <div class="langline">
        ${+k===OTHER_LANG
          ?`<input type="text" data-langother="${scope}" value="${esc(scope==='c'?S.commonLangOther:S.needs[+scope].langOther)}" placeholder="${esc(t('otherlang_ph'))}" style="flex:1;min-width:120px;padding:7px 11px;font-size:14px;border-radius:8px">`
          :`<b>${esc(lab(LANGLIST[+k]))}</b>`}
        ${sel('lvl|'+scope+'|'+k,LEVELS.map(x=>[x,x,x]),map[k],'—','sel-sm')}
        <button class="xbtn" type="button" data-act="rmlang" data-s="${scope}" data-v="${k}" aria-label="×">×</button>
      </div>`).join('')+`</div>`:''}
    ${addSel('addlang|'+scope,LANGLIST,keys.map(Number),keys.length?t('addlang2'):t('addlang'))}
  </div>`;
}
function regBlock(scope,arr){
  return `<div class="f">
    <span class="flab">${esc(t('region'))}${rq}</span>
    ${arr.length?`<div class="tags">`+arr.map(r=>`<span class="tag">${esc(lab(REGIONS[r]))}<button type="button" data-act="rmreg" data-s="${scope}" data-v="${r}" aria-label="×">×</button></span>`).join('')+`</div>`:''}
    ${addSel('addreg|'+scope,REGIONS,arr,arr.length?t('addreg2'):t('addreg'))}
  </div>`;
}

/* ============ шаги ============ */
const STEPS=[{id:'company'},{id:'needs'},{id:'cand'},{id:'edu'},{id:'submit'}];
const TITLES={company:['s1t','s1l'],needs:['s2t','s2l'],cand:['s3t','s3l'],edu:['s4t','s4l'],submit:['s5t','s5l']};

function viewCompany(){return `
  <p class="legend">${f('reqleg',{s:'<b>*</b>'})}</p>
  <div class="q">
    <div class="f"><label class="flab" for="company">${esc(t('company'))}${rq}</label>
      <input type="text" id="company" class="${bad('company')}" data-bind="company" value="${esc(S.company)}" placeholder="${esc(t('company_ph'))}" maxlength="200" autocomplete="organization">
      ${errOf('company')}</div>
    <div class="f"><label class="flab" for="person">${esc(t('person'))}${rq}</label>
      <input type="text" id="person" class="${bad('person')}" data-bind="person" value="${esc(S.person)}" placeholder="${esc(t('person_ph'))}" maxlength="100" autocomplete="name">
      ${errOf('person')}</div>
    <div class="f"><label class="flab" for="role">${esc(t('role'))}</label>
      <input type="text" id="role" data-bind="role" value="${esc(S.role)}" placeholder="${esc(t('role_ph'))}" maxlength="100"></div>
    <div class="f"><label class="flab" for="inn">${esc(t('inn'))}${rq}</label>
      <input type="text" id="inn" class="${bad('inn')}" data-bind="inn" value="${esc(S.inn)}" placeholder="${esc(t('inn_ph'))}" inputmode="numeric" maxlength="9">
      ${errOf('inn')}</div>
    <div class="f"><label class="flab" for="phone">${esc(t('phone'))}${rq}</label>
      <input type="text" id="phone" class="${bad('phone')}" data-bind="phone" value="${esc(S.phone)}" placeholder="+998 __ ___ __ __" inputmode="tel" maxlength="20" autocomplete="tel">
      ${errOf('phone')}</div>
  </div>
  <div class="q">
    <div class="qlabel">${esc(t('qhiring'))}${rq}</div>
    ${radios('hiring','hiring',[['yes',t('yes')],['no',t('no')],['unsure',t('unsure')]],S.hiring,true)}
    ${errOf('hiring')}
    ${S.hiring==='no'?`<div class="note">${esc(t('nonote'))}</div>`:''}
  </div>`;
}

function foldLine(n,i){
  const langs=langPairs(S.common?'c':String(i));
  const regs=(S.common?S.commonRegions:n.regions).map(r=>lab(REGIONS[r]));
  const bits=[nPeople(n.count)];
  if(n.grade!==null) bits.push(lab(GRADES[n.grade]).split(',')[0]);
  const m=money(n.rate); if(m) bits.push(m+' '+t('permonth'));
  if(langs.length) bits.push(langs.join(', '));
  if(regs.length) bits.push(regs.join(', '));
  if(n.quarter!==null) bits.push(lab(QUARTERS[n.quarter]));
  return `<div class="folded" data-act="open" data-i="${i}" role="button" tabindex="0">
    <span class="card-n">${i+1}</span>
    <span class="folded-txt"><b>${esc(dirLabel(n.dir)||t('nodir'))}</b><span>${esc(bits.join(' · '))}</span></span>
    ${S.open===i?'':`<button class="btn btn-sm btn-quiet" type="button" data-act="open" data-i="${i}">${esc(t('edit'))}</button>`}
    ${S.needs.length>1?`<button class="xbtn" type="button" data-act="rmneed" data-i="${i}" aria-label="×">×</button>`:''}
  </div>`;
}
function combo(i,n){
  const open=String(S.openCombo)===String(i),qv=S.comboQuery||'';
  const custom=open&&String(S.comboCustom)===String(i);
  let list='';
  if(open){
    const q=qv.trim().toLowerCase(); let inner='';
    if(custom){
      inner=`<div class="combo-hint">${esc(t('dir_write_hint'))}</div>`;
      if(q) inner+=`<div class="combo-o combo-add" data-act="pickother" data-i="${i}" data-v="${esc(qv)}">${esc(f('adddir',{q:qv}))}</div>`;
    } else {
      inner=`<div class="combo-o combo-add" data-act="othermode" data-i="${i}">${esc(t('dir_other'))}</div>`;
      let any=false;
      DIRS.forEach((grp,gi)=>{
        const hits=grp[1].map((x,ii)=>[ii,lab(x)]).filter(([,txt])=>!q||txt.toLowerCase().indexOf(q)>-1);
        if(!hits.length)return; any=true;
        inner+=`<div class="combo-g">${esc(lab(grp[0]))}</div>`+hits.map(([ii,txt])=>
          `<div class="combo-o" data-act="pickdir" data-i="${i}" data-g="${gi}" data-ii="${ii}">${esc(txt)}</div>`).join('');
      });
      if(!any&&q) inner+=`<div class="combo-empty">${esc(t('nofound'))}</div>
        <div class="combo-o combo-add" data-act="pickother" data-i="${i}" data-v="${esc(qv)}">${esc(f('adddir',{q:qv}))}</div>`;
    }
    list=`<div class="combo-list">${inner}</div>`;
  }
  const ph=custom?t('dir_write'):t('dir_ph');
  return `<div class="combo"><input type="text" id="dir-${i}" data-combo="${i}" autocomplete="off" class="${custom?'combo-custom':''}"
    placeholder="${esc(ph)}" value="${esc(open?qv:dirLabel(n.dir))}">${list}</div>`;
}
function certCombo(){
  const open=String(S.openCombo)==='cert',qv=S.comboQuery||'';
  const custom=open&&String(S.comboCustom)==='cert';
  const chips=(S.certs.list.length||S.certs.others.length)
    ?`<div class="tags" style="margin-bottom:9px">`
      +S.certs.list.map(c=>`<span class="tag">${esc(lab(CERTS[c]))}<button type="button" data-act="rmcert" data-v="${c}" aria-label="×">×</button></span>`).join('')
      +S.certs.others.map((o,k)=>`<span class="tag">${esc(o)}<button type="button" data-act="rmcerto" data-v="${k}" aria-label="×">×</button></span>`).join('')
      +`</div>`:'';
  let list='';
  if(open){
    const q=qv.trim().toLowerCase(); let inner='';
    if(custom){
      inner=`<div class="combo-hint">${esc(t('cert_write_hint'))}</div>`;
      if(q) inner+=`<div class="combo-o combo-add" data-act="certadd" data-v="${esc(qv)}">${esc(f('adddir',{q:qv}))}</div>`;
    } else {
      inner=`<div class="combo-o combo-add" data-act="certother_mode">${esc(t('cert_other'))}</div>`;
      let any=false;
      CERTS.forEach((c,ci)=>{ if(S.certs.list.indexOf(ci)>-1)return; const txt=lab(c); if(q&&txt.toLowerCase().indexOf(q)<0)return; any=true;
        inner+=`<div class="combo-o" data-act="pickcert" data-ci="${ci}">${esc(txt)}</div>`; });
      if(!any&&q) inner+=`<div class="combo-empty">${esc(t('nofound'))}</div>
        <div class="combo-o combo-add" data-act="certadd" data-v="${esc(qv)}">${esc(f('adddir',{q:qv}))}</div>`;
    }
    list=`<div class="combo-list">${inner}</div>`;
  }
  const ph=custom?t('cert_write'):t('cert_ph');
  return `${chips}<div class="combo"><input type="text" id="cert-combo" data-combo="cert" autocomplete="off" class="${custom?'combo-custom':''}"
    placeholder="${esc(ph)}" value="${esc(open?qv:'')}">${list}</div>`;
}
function openCard(n,i){

      <div><button class="btn btn-sm" type="button" data-act="close">${esc(t('fold'))}</button></div>
    </div></div>`;
}
function langInner(i,n){
  const keys=Object.keys(n.langs);
  return `${keys.length?`<div style="display:flex;flex-direction:column;gap:7px">`+keys.map(k=>`
      <div class="langline">

          ?`<input type="text" data-langother="${i}" value="${esc(n.langOther)}" placeholder="${esc(t('otherlang_ph'))}" style="flex:1;min-width:120px;padding:7px 11px;font-size:14px;border-radius:8px">`

      </div>`).join('')+`</div>`:''}

}
function regInner(i,n){

function dirBlock(n,i){
  const err=S.errors['need'+i];
  return `<div class="dblock ${err?'invalid':''}">
    <div class="dblock-head">
      <span class="rn">${i+1}</span>
      <div class="dblock-dir">
        <div class="dblock-dlabel">${esc(t('dir'))}${rq}</div>
        ${combo(i,n)}
      </div>

    </div>
    <table class="dtbl"><tbody>
      <tr><th>${esc(t('count'))}${rq}</th><td>
        <span class="stepper">
          <button type="button" data-act="dec" data-i="${i}" aria-label="−">−</button>
          <input type="number" min="1" max="2000" data-count="${i}" value="${n.count}">

        </span></td></tr>
      <tr><th>${esc(t('grade'))}${rq}</th><td>${sel('grade|'+i,GRADES,n.grade,t('grade_ph'))}</td></tr>
      <tr><th>${esc(t('rate_row'))}</th><td>
        <span class="rate-cell">
          <input type="number" min="0" step="1" data-rate="${i}" value="${esc(n.rate)}" placeholder="${esc(t('rate_ph'))}">
          <select class="sel" data-sel="currency" aria-label="${esc(t('currency'))}">${CURRENCIES.map(c=>`<option value="${c[0]}" ${S.currency===c[0]?'selected':''}>${esc(c[1][LI])}</option>`).join('')}</select>
        </span></td></tr>
      <tr><th>${esc(t('when'))}${rq}</th><td>${sel('quarter|'+i,QUARTERS,n.quarter,t('when_ph'))}</td></tr>
      <tr><th>${esc(t('langs'))}</th><td>${langInner(i,n)}</td></tr>
      <tr><th>${esc(t('region'))}${rq}</th><td>${regInner(i,n)}</td></tr>
    </tbody></table>
    ${err?`<div class="dblock-err">${err}</div>`:''}
  </div>`;
}
function guideCard(){
  const items=[1,2,3,4,5,6,7].map(n=>`<div class="guide-item"><span class="gnum">${n}</span><div><b>${esc(t('g'+n+'h'))}</b> — ${esc(t('g'+n+'d'))}</div></div>`).join('');
  return `<div class="guide ${S.guideOpen?'':'closed'}">
    <div class="guide-h" data-act="guidetoggle">

}

<script>
/* ============ сводка и выгрузка ============ */
function needLine(n,i){
  const langs=langPairs(String(i));
  const regs=n.regions.map(r=>lab(REGIONS[r]));
  const bits=[];
  if(n.grade!==null)bits.push(lab(GRADES[n.grade]).split(',')[0]);
  const m=money(n.rate); if(m)bits.push(m+' '+t('permonth'));
  if(langs.length)bits.push(langs.join(', '));
  if(regs.length)bits.push(regs.join(', '));
  if(n.quarter!==null)bits.push(lab(QUARTERS[n.quarter]));
  return `<div class="sum-i"><b>${esc(dirLabel(n.dir))}</b> — ${esc(nPeople(n.count))}
    <em>${esc(bits.join(' · '))||esc(t('nodetails'))}</em></div>`;
}
function payload(){
  const langsOf=(n,i)=>{const sc=String(i);const m=n.langs;const o={};
    Object.keys(m).forEach(k=>{o[+k===OTHER_LANG?(otherName(sc)||'Другое'):LANGLIST[+k][0]]=LEVELS[m[k]]});return o};
  return JSON.stringify({
    formLanguage:S.lang,
    company:S.company||null,inn:S.inn||null,person:S.person||null,role:S.role||null,phone:S.phone||null,
    hiring:S.hiring,totalPeople:S.hiring==='no'?0:totalPeople(),currency:S.currency,
    needs:S.hiring==='no'?[]:S.needs.filter(n=>n.dir).map((n,i)=>({
      direction:dirRu(n.dir),
      directionId:n.dir&&n.dir.other!==undefined?'other':(n.dir?n.dir.g+'.'+n.dir.i:null),
      count:n.count,
      grade:n.grade===null?null:GRADES[n.grade][0],
      monthlyRate:n.rate===''||n.rate===null?null:Number(n.rate),
      languages:langsOf(n,i),
      regions:n.regions.map(r=>REGIONS[r][0]),
      quarter:n.quarter===null?null:QUARTERS[n.quarter][0]})),
    experience:{mode:S.exp,trainMonths:S.trainMonths===null?null:TRAIN_MONTHS[S.trainMonths][0],minYears:S.expYears===null?null:EXP_YEARS[S.expYears][0]},
    certifications:{required:S.certs.req,list:S.certs.list.map(c=>CERTS[c][0]),other:S.certs.others.length?S.certs.others:null},
    education:{history:S.edu.past,
      organisations:S.edu.orgs.map(o=>({name:o.name,type:o.type===null?null:ORG_TYPES[o.type][0],relation:o.rel===null?null:ORG_REL[o.rel][0]})),
      participation:S.edu.forms,practicePlaces:S.edu.forms.indexOf('practice')>-1?S.edu.places:null,critical:S.edu.critical||null},
    consent:S.consent
  },null,2);
}
function reportBody(){
  const d=new Date();
  const loc=S.lang==='uz'?'uz-UZ':S.lang==='en'?'en-US':'ru-RU';
  let dt; try{dt=d.toLocaleDateString(loc)+' '+d.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'});}catch(e){dt=d.toISOString().slice(0,16).replace('T',' ');}
  const hiringTxt=S.hiring==='yes'?t('yes'):S.hiring==='no'?t('no'):S.hiring==='unsure'?t('unsure'):'—';
  const row=(l,v)=>`<tr><td class="rl">${esc(l)}</td><td>${esc(v)}</td></tr>`;
  let h=`<div class="rhead"><div><h1>${esc(t('rep_title'))}</h1><div class="rdate">${esc(t('rep_date'))}: ${esc(dt)}</div></div>
    <div class="rlogos"><img src="${IT_LOGO}" alt=""><img src="${TP_LOGO}" alt=""></div></div>`;
  h+=`<h2>${esc(t('s1t'))}</h2><table class="rt">`
    +row(t('company'),S.company||'—')+row(t('inn'),S.inn||'—')+row(t('person'),S.person||'—')
    +(S.role?row(t('role'),S.role):'')+row(t('phone'),S.phone||'—')+row(t('qhiring'),hiringTxt)+`</table>`;
  if(S.hiring==='yes'){
    let blocks='',dnum=0;
    S.needs.forEach((n,idx)=>{ if(!n.dir)return; dnum++;
      const langs=langPairs(String(idx)).join(', ')||'—';
      const regs=n.regions.map(r=>lab(REGIONS[r])).join(', ')||'—';
      const grade=n.grade===null?'—':lab(GRADES[n.grade]);
      const m=money(n.rate); const q=n.quarter===null?'—':lab(QUARTERS[n.quarter]);
      blocks+=`<h3 class="rd">${esc(t('dir'))} ${dnum}: ${esc(dirLabel(n.dir))}</h3><table class="rt">`
        +row(t('count'),String(n.count))+row(t('grade'),grade)+row(t('rate_row'),m||'—')
        +row(t('when'),q)+row(t('langs'),langs)+row(t('region'),regs)+`</table>`;
    });
    if(blocks) h+=`<h2>${esc(t('s2t'))}</h2>`+blocks;
    const expMap={yes:'exp_yes',train:'exp_train',some:'exp_some',no:'exp_no'};
    let expTxt=S.exp?t(expMap[S.exp]):'—';
    if(S.exp==='train'&&S.trainMonths!==null)expTxt+=' ('+lab(TRAIN_MONTHS[S.trainMonths])+')';
    if(S.exp==='no'&&S.expYears!==null)expTxt+=' ('+lab(EXP_YEARS[S.expYears])+')';
    const creqMap={must:'cert_must',plus:'cert_plus',no:'cert_no'};
    let certTxt=S.certs.req?t(creqMap[S.certs.req]):'—';
    const certList=[...S.certs.list.map(c=>lab(CERTS[c])),...S.certs.others];
    if((S.certs.req==='must'||S.certs.req==='plus')&&certList.length)certTxt+=': '+certList.join(', ');
    h+=`<h2>${esc(t('s3t'))}</h2><table class="rt">`+row(t('qexp'),expTxt)+row(t('qcert'),certTxt)+`</table>`;
    const pastMap={now:'past_now',was:'past_was',want:'past_want',never:'past_never'};
    let eduTbl=row(t('qpast'),S.edu.past?t(pastMap[S.edu.past]):'—');
    const orgs=S.edu.orgs.filter(o=>o.name).map(o=>o.name+(o.type!==null?' ('+lab(ORG_TYPES[o.type])+')':'')).join('; ');
    if(orgs)eduTbl+=row(t('qorgs'),orgs);
    if(S.edu.critical)eduTbl+=row(t('qcrit'),S.edu.critical);
    h+=`<h2>${esc(t('s4t'))}</h2><table class="rt">`+eduTbl+`</table>`;
  }
  h+=`<p class="rc">${S.consent.truth?'☑':'☐'} ${esc(t('truth'))}<br>${S.consent.talent?'☑':'☐'} ${esc(t('talent'))}</p>`;
  return h;
}
function buildReportDoc(){
  const css=`*{box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;color:#212529;margin:0;padding:14mm;font-size:12.5px;line-height:1.45}`
    +`.rhead{display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:2px solid #7BC24D;padding-bottom:12px;margin-bottom:14px}`
    +`.rlogos{display:flex;gap:12px;align-items:center}.rhead img{height:30px}h1{font-size:19px;margin:0 0 2px}.rdate{color:#666;font-size:12px}`
    +`h2{font-size:14px;margin:16px 0 7px;color:#4E8A29}h3.rd{font-size:13px;font-weight:600;margin:14px 0 5px;color:#212529}`
    +`table.rt{width:100%;border-collapse:collapse}table.rt td,table.rt th{border:1px solid #D8DDE2;padding:6px 9px;text-align:left;vertical-align:top}`
    +`td.rl{width:34%;background:#F4F6F8;color:#555;font-weight:500}table.grid th{background:#F4F6F8;color:#555;font-weight:600;font-size:12px}`
    +`.rc{margin-top:14px;font-size:12.5px}@page{margin:12mm}`;
  return `<!doctype html><html lang="${S.lang}"><head><meta charset="utf-8"><title>${esc(t('rep_title'))}</title><style>${css}</style></head><body>${reportBody()}</body></html>`;
}
function printReport(){
  const ifr=document.createElement('iframe');
  ifr.setAttribute('aria-hidden','true');
  ifr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(ifr);
  const d=ifr.contentWindow.document; d.open(); d.write(buildReportDoc()); d.close();
  setTimeout(()=>{try{ifr.contentWindow.focus();ifr.contentWindow.print();}catch(e){}
    setTimeout(()=>{try{ifr.remove();}catch(e){}},3000);},500);
}
function viewSubmit(){
  if(S.sent) return `<div class="done-wrap">
    <div class="done-mark">✓</div>
    <div class="steptitle">${esc(t('donet'))}</div>
    <p class="steplead" style="text-align:center">${esc(t('donel'))}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <button class="btn btn-sm btn-primary" type="button" data-act="showjson">${esc(S.showJson?t('hidejson'):t('showjson'))}</button>
      <button class="btn btn-sm btn-quiet" type="button" data-act="reset">${esc(t('refill'))}</button>
    </div>
    ${S.showJson?`<div class="report-wrap">
      <div class="paper">${reportBody()}</div>
      <div style="margin-top:14px;text-align:center"><button class="btn btn-primary" type="button" data-act="pdf">${esc(t('downloadpdf'))}</button></div>
    </div>`:''}
  </div>`;
  const summary=S.hiring==='no'
    ?`<div class="sum"><div class="sum-h">${esc(t('sumno'))}</div><div class="sum-i">${esc(t('sumnoi'))}</div></div>`
    :`<div class="sum"><div class="sum-h">${esc(f('sumh',{p:nPeople(totalPeople())}))}</div>${S.needs.map((n,i)=>n.dir?needLine(n,i):'').join('')}</div>`;
  return `${summary}
  <div class="q">
    <div class="opts">
      <label class="opt ${S.consent.truth?'on':''}">
        <input type="checkbox" data-act="ctruth" ${S.consent.truth?'checked':''}>
        <span>${esc(t('truth'))}${rq}</span></label>
    </div>${errOf('truth')}
  </div>
  <div class="q">
    <div class="tp-card">
      <p class="tp-about">${esc(t('talent_about'))}</p>
      <label class="opt ${S.consent.talent?'on':''}">
        <input type="checkbox" data-act="ctalent" ${S.consent.talent?'checked':''}>
        <span>${esc(t('talent'))}<small>${esc(t('talent_s'))}</small></span></label>
    </div>
  </div>`;
}

/* ============ проверка ============ */
function validate(id){
  S.errors={};
  if(id==='company'){
    if(!S.company.trim()) S.errors.company=t('e_company');
    if(!S.person.trim()) S.errors.person=t('e_person');
    const innd=(S.inn.match(/\d/g)||[]).length;
    if(!S.inn.trim()) S.errors.inn=t('e_inn');
    else if(innd<9) S.errors.inn=t('e_inn2');
    const d=(S.phone.match(/\d/g)||[]).length;
    if(!S.phone.trim()) S.errors.phone=t('e_phone');
    else if(d<9) S.errors.phone=t('e_phone2');
    if(!S.hiring) S.errors.hiring=t('e_hiring');
  }
  if(id==='needs'){
    let filled=0,firstBad=-1;
    S.needs.forEach((n,i)=>{
      const touched=n.dir||n.grade!==null||n.quarter!==null||Object.keys(n.langs).length||n.regions.length;
      if(!touched) return;
      const miss=[];
      if(!n.dir) miss.push(t('m_dir'));
      if(n.grade===null) miss.push(t('m_grade'));
      if(!n.regions.length) miss.push(t('m_region'));
      if(n.quarter===null) miss.push(t('m_period'));
      if(miss.length){S.errors['need'+i]=f('e_fill',{m:miss.join(', ')});if(firstBad<0)firstBad=i}
      else filled++;
    });
    if(firstBad>=0) S.open=firstBad;
    if(!filled&&firstBad<0) S.errors.needs=t('e_needs');
  }
  if(id==='cand'){
    if(!S.exp) S.errors.exp=t('e_choose');
    if(!S.certs.req) S.errors.creq=t('e_choose');
  }
  if(id==='edu'&&!S.edu.past) S.errors.past=t('e_choose');
  if(id==='submit'){
    if(!S.consent.truth) S.errors.truth=t('e_truth');
  }
  return !Object.keys(S.errors).length;
}

/* ============ отрисовка ============ */
const VIEWS={company:viewCompany,needs:viewNeeds,cand:viewCand,edu:viewEdu,submit:viewSubmit};
function render(){
  const vis=visible(),pos=vis.indexOf(S.step),st=STEPS[S.step];
  document.documentElement.lang=S.lang;
  document.getElementById('lsw').innerHTML=UILANGS.map(([code,lbl],i)=>
    `<button type="button" data-lang="${code}" aria-pressed="${LI===i}">${lbl}</button>`).join('');
  document.getElementById('psteps').innerHTML=vis.map((s,i)=>{
    const done=S.sent||i<pos, now=!S.sent&&i===pos;
    const dot=`<button type="button" class="pdot ${done?'done':now?'now':''}" data-goto="${i}" ${S.sent?'disabled':''}>${done?'✓':i+1}</button>`;
    const bar=i<vis.length-1?`<span class="pbar ${done?'done':''}"></span>`:'';
    return dot+bar;
  }).join('');
  document.getElementById('stepmeta').textContent=S.sent?t('sent'):t('mins');
  {const rb=document.getElementById('resetBtn');if(rb)rb.textContent=t('restart');}
  {const setSrc=(id,src)=>{const e=document.getElementById(id);if(e&&!e.src)e.src=src;};
   setSrc('itLogo',IT_LOGO);setSrc('brandLogoL',TP_LOGO);setSrc('decLogoL',DEC_LOGO);setSrc('minLogo',MIN_LOGO);}
  document.getElementById('foot').hidden=true;
  const [tk,lk]=TITLES[st.id];
  const twoCol=(st.id==='needs'&&!S.sent);
  const head=(S.sent||twoCol)?'':`<div><h1 class="steptitle">${esc(t(tk))}</h1><p class="steplead">${esc(t(lk))}</p></div>`;
  const banner='';
  document.getElementById('main').classList.toggle('wide',twoCol);
  document.getElementById('main').innerHTML=`<div class="step">${banner}${head}${VIEWS[st.id]()}</div>`;
  const back=document.getElementById('back'),next=document.getElementById('next');
  back.hidden=(pos===0||S.sent); next.hidden=S.sent;
  back.textContent=t('back');
  next.textContent=st.id==='submit'?t('submit'):t('next');
  if(S.focusCombo!=null){
    const inp=document.querySelector('[data-combo="'+S.focusCombo+'"]');
    if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
    S.focusCombo=null;
  }
  if(S.openCombo!=null){
    const inp=document.querySelector('[data-combo="'+S.openCombo+'"]');
    const list=inp&&inp.closest('.combo').querySelector('.combo-list');
    if(inp&&list&&inp.closest('.tablewrap')){
      const r=inp.getBoundingClientRect();
      list.style.position='fixed';list.style.top=(r.bottom+4)+'px';list.style.left=r.left+'px';
      list.style.width=r.width+'px';list.style.right='auto';list.style.zIndex='60';
    }
  }
  const e=document.querySelector('.err'); if(e) e.scrollIntoView({block:'center',behavior:'smooth'});
}

/* ============ события ============ */
const main=document.getElementById('main');

document.getElementById('lsw').addEventListener('click',ev=>{
  const b=ev.target.closest('[data-lang]'); if(!b) return;
  S.lang=b.dataset.lang; LI=UILANGS.findIndex(x=>x[0]===S.lang);
  save(); render();
});

main.addEventListener('change',ev=>{
  const el=ev.target; if(!el.dataset.sel) return;
  const [act,a,b]=el.dataset.sel.split('|'); const v=el.value;
  if(act==='currency') S.currency=v||'USD';
  else if(act==='grade'){S.needs[+a].grade=v===''?null:+v;S.needs[+a].example=false}
  else if(act==='quarter'){S.needs[+a].quarter=v===''?null:+v;S.needs[+a].example=false}
  else if(act==='lvl'){const m=a==='c'?S.commonLangs:S.needs[+a].langs;if(v!=='')m[b]=+v}
  else if(act==='addlang'){if(v==='')return;const m=a==='c'?S.commonLangs:S.needs[+a].langs;m[v]=1;if(a!=='c')S.needs[+a].example=false}
  else if(act==='addreg'){if(v==='')return;if(a==='c'){if(S.commonRegions.indexOf(+v)<0)S.commonRegions.push(+v)}else{S.needs[+a].regions=[+v];S.needs[+a].example=false}}
  else if(act==='addcert'){if(v==='')return;if(S.certs.list.indexOf(+v)<0)S.certs.list.push(+v)}
  else if(act==='train') S.trainMonths=v===''?null:+v;
  else if(act==='expy') S.expYears=v===''?null:+v;
  else if(act==='otype') S.edu.orgs[+a].type=v===''?null:+v;
  else if(act==='orel') S.edu.orgs[+a].rel=v===''?null:+v;
  else return;
  save(); render();
});

main.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act,v=el.dataset.v,i=el.dataset.i,s=el.dataset.s;
  if(act==='hiring'){S.hiring=v}
  else if(act==='common'){S.common=!S.common}
  else if(act==='open'){S.open=+i}
  else if(act==='close'){S.open=-1}
  else if(act==='guidetoggle'){S.guideOpen=!S.guideOpen}
  else if(act==='addneed'){S.needs.push(blankNeed());S.open=S.needs.length-1}
  else if(act==='copyneed'){const l=S.needs[S.needs.length-1];S.needs.push(Object.assign({},l,{langs:Object.assign({},l.langs),regions:l.regions.slice(),example:false}));S.open=S.needs.length-1}
  else if(act==='rmneed'){S.needs.splice(+i,1);if(S.open>=S.needs.length)S.open=S.needs.length-1}
  else if(act==='inc'){const n=S.needs[+i];n.count=Math.min(2000,n.count+1);n.example=false}
  else if(act==='dec'){const n=S.needs[+i];n.count=Math.max(1,n.count-1);n.example=false}
  else if(act==='pickdir'){S.needs[+i].dir={g:+el.dataset.g,i:+el.dataset.ii};S.needs[+i].example=false;S.openCombo=null;S.comboQuery='';S.comboCustom=null}
  else if(act==='othermode'){S.comboCustom=el.dataset.i;S.openCombo=el.dataset.i;S.comboQuery='';S.focusCombo=el.dataset.i;render();return}
  else if(act==='pickother'){if(!(v||'').trim())return;S.needs[+i].dir={other:v};S.needs[+i].example=false;S.openCombo=null;S.comboQuery='';S.comboCustom=null}
  else if(act==='rmlang'){const m=s==='c'?S.commonLangs:S.needs[+s].langs;delete m[v]}
  else if(act==='rmreg'){const r=s==='c'?S.commonRegions:S.needs[+s].regions;const k=r.indexOf(+v);if(k>-1)r.splice(k,1)}
  else if(act==='rmcert'){const k=S.certs.list.indexOf(+v);if(k>-1)S.certs.list.splice(k,1)}
  else if(act==='pickcert'){const ci=+el.dataset.ci;if(S.certs.list.indexOf(ci)<0)S.certs.list.push(ci);S.openCombo=null;S.comboQuery='';S.comboCustom=null}
  else if(act==='certother_mode'){S.comboCustom='cert';S.openCombo='cert';S.comboQuery='';S.focusCombo='cert';render();return}
  else if(act==='certadd'){if(!(v||'').trim())return;S.certs.others.push(v.trim().slice(0,60));S.openCombo=null;S.comboQuery='';S.comboCustom=null}
  else if(act==='rmcerto'){S.certs.others.splice(+v,1)}
  else if(act==='exp'){S.exp=v}
  else if(act==='creq'){S.certs.req=v}
  else if(act==='past'){S.edu.past=v;if(v!=='never'&&!S.edu.orgs.length)S.edu.orgs.push({name:'',type:null,rel:null})}
  else if(act==='addorg'){S.edu.orgs.push({name:'',type:null,rel:null})}
  else if(act==='rmorg'){S.edu.orgs.splice(+i,1)}
  else if(act==='eform'){const k=S.edu.forms.indexOf(v);
    if(k>-1)S.edu.forms.splice(k,1);
    else if(v==='none')S.edu.forms=['none'];
    else{S.edu.forms=S.edu.forms.filter(x=>x!=='none');S.edu.forms.push(v)}}
  else if(act==='pinc'){S.edu.places=Math.min(50,S.edu.places+1)}
  else if(act==='pdec'){S.edu.places=Math.max(1,S.edu.places-1)}
  else if(act==='ctruth'){S.consent.truth=!S.consent.truth}
  else if(act==='cshare'){S.consent.share=v}
  else if(act==='ctalent'){S.consent.talent=!S.consent.talent}
  else if(act==='showjson'){S.showJson=!S.showJson;render();return}
  else if(act==='pdf'){printReport();return}
  else if(act==='copyjson'){
    const note=document.getElementById('copynote'),text=payload();
    const ok=()=>{if(note){note.textContent=t('copied');setTimeout(()=>note.textContent='',2000)}};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok).catch(()=>{
        const box=document.getElementById('jsonbox');
        if(box){const r=document.createRange();r.selectNodeContents(box);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)}
        if(note)note.textContent=t('copyman');
      });
    }
    return;
  }
  else if(act==='reset'){const lg=S.lang;try{localStorage.removeItem(KEY)}catch(e){}S=fresh();S.lang=lg;restored=false;render();return}
  else return;
  S.errors={}; save(); render();
});

main.addEventListener('keydown',ev=>{
  const el=ev.target.closest('.folded'); if(!el) return;
  if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();S.open=+el.dataset.i;render()}
});

const onlyDigits=(v,max)=>v.replace(/\D/g,'').slice(0,max);
const nameClean=(v,max)=>v.replace(/[^\p{L}\s\-'’.]/gu,'').replace(/\s{2,}/g,' ').slice(0,max);
const phoneClean=v=>{const plus=v.trimStart().startsWith('+');let c=v.replace(/[^\d\s()\-]/g,'').replace(/\s{2,}/g,' ');return ((plus?'+':'')+c).slice(0,20);};
main.addEventListener('input',ev=>{
  const el=ev.target;
  const fix=c=>{if(el.value!==c){const p=el.selectionStart;el.value=c;try{el.setSelectionRange(p,p)}catch(e){}}return c;};
  if(el.dataset.combo!==undefined){S.openCombo=el.dataset.combo;S.comboQuery=el.value;S.focusCombo=el.dataset.combo;save();render();return}
  if(el.dataset.rate!==undefined){const c=fix(onlyDigits(el.value,7));const n=S.needs[+el.dataset.rate];n.rate=c===''?'':Math.min(99999,parseInt(c,10)||0);n.example=false;save();return}
  if(el.dataset.count!==undefined){const c=fix(onlyDigits(el.value,4));const n=S.needs[+el.dataset.count];n.count=Math.max(1,Math.min(2000,parseInt(c||'1',10)||1));n.example=false;save();return}
  if(el.dataset.langother!==undefined){const c=fix(nameClean(el.value,40));const sc=el.dataset.langother;if(sc==='c')S.commonLangOther=c;else S.needs[+sc].langOther=c;save();return}
  if(el.dataset.org!==undefined){const c=fix(el.value.slice(0,120));S.edu.orgs[+el.dataset.org].name=c;save();return}
  if(el.dataset.places!==undefined){const c=fix(onlyDigits(el.value,2));S.edu.places=Math.max(1,Math.min(50,parseInt(c||'1',10)||1));save();return}
  const b=el.dataset.bind;
  if(b==='company')S.company=fix(el.value.slice(0,200));
  else if(b==='person')S.person=fix(nameClean(el.value,100));
  else if(b==='role')S.role=fix(el.value.slice(0,100));
  else if(b==='inn')S.inn=fix(onlyDigits(el.value,9));
  else if(b==='phone')S.phone=fix(phoneClean(el.value));
  else if(b==='critical')S.edu.critical=fix(el.value.slice(0,500));
  else return;
  save();
});

main.addEventListener('focusin',ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.combo!==undefined&&String(S.openCombo)!==String(el.dataset.combo)){
    S.openCombo=el.dataset.combo;S.comboQuery='';S.focusCombo=el.dataset.combo;render();
  }
});
document.addEventListener('click',ev=>{
  if(S.openCombo==null)return;
  if(ev.target.closest('.combo'))return;
  S.openCombo=null;S.comboQuery='';S.comboCustom=null;render();
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&S.openCombo!=null){S.openCombo=null;S.comboQuery='';S.comboCustom=null;render()}
});

document.getElementById('back').addEventListener('click',()=>{
  const vis=visible(),pos=vis.indexOf(S.step);
  if(pos>0){S.step=vis[pos-1];S.errors={};save();render();scrollTo({top:0,behavior:'smooth'})}
});
document.getElementById('next').addEventListener('click',()=>{
  const st=STEPS[S.step];
  if(!validate(st.id)){render();return}
  if(st.id==='submit'){S.sent=true;save();render();scrollTo({top:0,behavior:'smooth'});return}
  const vis=visible(),pos=vis.indexOf(S.step);
  S.step=vis[Math.min(pos+1,vis.length-1)];
  save();render();scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  const lg=S.lang;try{localStorage.removeItem(KEY)}catch(e){}S=fresh();S.lang=lg;restored=false;render();scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('psteps').addEventListener('click',ev=>{
  if(S.sent)return;
  const el=ev.target.closest('[data-goto]'); if(!el)return;
  const vis=visible(),pos=vis.indexOf(S.step),target=+el.dataset.goto;
  if(target===pos)return;
  if(target<pos){S.step=vis[target];S.errors={};save();render();scrollTo({top:0,behavior:'smooth'});return}
  for(let p=pos;p<target;p++){ if(!validate(STEPS[vis[p]].id)){S.step=vis[p];render();scrollTo({top:0,behavior:'smooth'});return} }
  S.errors={};S.step=vis[target];save();render();scrollTo({top:0,behavior:'smooth'});
});

render();
</script>

</body></html>
